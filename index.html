<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can you guess AI? | Human art or AI?</title>
    <style>
        /* CSS Reset & Global Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(ellipse at top, #1c1c22 0%, #0d0e12 55%, #000000 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Particle Canvas for Victory Effects */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* Main App Container */
        .app-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
        }

        /* Top Navigation Tabs (Matching Notebook Sketch) */
        .top-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }

        .nav-frame-btn {
            flex: 1;
            background: transparent;
            border: 2px solid #d1d5db; /* Light gray frame */
            color: #ffffff;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .nav-frame-btn:hover {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .nav-frame-btn.active {
            border-color: #D4AF37; /* Gold frame when active */
            color: #D4AF37;        /* Gold text when active */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            background-color: rgba(212, 175, 55, 0.05);
        }

        /* View Sections */
        .main-section {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .main-section.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section Headings */
        h1.section-title {
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            color: #ffffff;
            border: 2px solid #d1d5db;
            padding: 10px 24px;
            border-radius: 8px;
            display: inline-block;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #ffffff;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .zoom-hint {
            font-size: 0.9rem;
            color: #D4AF37;
            text-align: center;
            margin-bottom: 25px;
            font-style: italic;
        }

        /* Level Sub-Navigation (Section 1) */
        .level-switcher {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .level-tab {
            background: transparent;
            border: 1px solid #d1d5db;
            color: #ffffff;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
        }

        .level-tab.active {
            border-color: #D4AF37;
            color: #D4AF37;
            background-color: rgba(212, 175, 55, 0.1);
        }

        .level-content {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .level-content.active {
            display: flex;
        }

        .level-title-display {
            font-size: 1.25rem;
            color: #D4AF37;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Image Grid (Section 1 - 3 Images) */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 25px;
        }

        /* Image Grid (Section 2 - 6 Images) */
        .grid-6 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
        }

        @media (max-width: 850px) {
            .grid-3 {
                grid-template-columns: 1fr;
                max-width: 480px;
            }
            .grid-6 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 520px) {
            .grid-6 {
                grid-template-columns: 1fr;
                max-width: 480px;
            }
        }

        /* Artwork Cards */
        .artwork-card {
            background: #0a0a0a;
            border: 2px solid #d1d5db; /* Light gray frame */
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .artwork-card.selected {
            border-color: #D4AF37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
        }

        .img-container {
            width: 100%;
            height: 250px;
            background-color: #111111;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            cursor: pointer;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .img-container:hover img {
            transform: scale(1.03);
        }

        .img-container::after {
            content: '🔍 Zoom';
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.72rem;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .img-container:hover::after {
            background: #D4AF37;
            color: #000000;
            font-weight: bold;
        }

        /* AI Selection Buttons */
        .ai-select-btn {
            width: 100%;
            background: transparent;
            border: 1.5px solid #d1d5db;
            color: #ffffff;
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ai-select-btn:hover {
            border-color: #ffffff;
        }

        .ai-select-btn.selected {
            border-color: #D4AF37;
            color: #D4AF37; /* Text becomes gold when clicked */
            background-color: rgba(212, 175, 55, 0.1);
        }

        /* Section 2 Choice Boxes */
        .choice-boxes {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 500px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .choice-btn {
            flex: 1;
            background: #0a0a0a;
            border: 2px solid #d1d5db; /* Light gray frame */
            color: #ffffff;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .choice-btn:hover {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .choice-btn.selected {
            border-color: #D4AF37;
            color: #D4AF37;
            background-color: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Submit Action Buttons */
        .action-btn {
            background: transparent;
            border: 2px solid #D4AF37;
            color: #D4AF37;
            padding: 12px 36px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .action-btn:hover {
            background-color: #D4AF37;
            color: #000000;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666666;
            color: #666666;
            background: transparent;
            box-shadow: none;
        }

        /* Feedback Message Box */
        .feedback-area {
            width: 100%;
            max-width: 700px;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 30px;
            min-height: 50px;
        }

        .feedback-text {
            font-size: 1.25rem;
            font-weight: 700;
            padding: 15px 20px;
            border-radius: 8px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease forwards;
        }

        .feedback-text.success {
            color: #D4AF37;
            border: 1px solid #D4AF37;
            background: rgba(212, 175, 55, 0.08);
        }

        .feedback-text.error {
            color: #e5e7eb;
            border: 1px solid #4b5563;
            background: rgba(255, 255, 255, 0.05);
        }

        .artist-description {
            font-size: 1.05rem;
            color: #ffffff;
            margin-top: 10px;
            font-weight: 400;
        }

        .artist-description a {
            color: #D4AF37;
            text-decoration: underline;
        }

        /* Revealed Badge Labels */
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            display: none;
        }

        .badge.ai {
            background-color: #b91c1c;
            color: #ffffff;
        }

        .badge.original {
            background-color: #15803d;
            color: #ffffff;
        }

        /* Lightbox Modal for Zooming */
        .zoom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(8px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            padding: 20px;
        }

        .zoom-modal.active {
            display: flex;
            opacity: 1;
        }

        .zoom-content {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .zoom-content img {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            border: 2px solid #D4AF37;
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .modal-close {
            position: absolute;
            top: -45px;
            right: 0;
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            border-color: #D4AF37;
            color: #D4AF37;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 25px 0 10px 0;
            font-size: 0.9rem;
            color: #9ca3af;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Particle Animation Canvas -->
    <canvas id="particleCanvas"></canvas>

    <div class="app-container">

        <!-- Top Navigation Frames (As sketched in notebook) -->
        <div class="top-nav">
            <button class="nav-frame-btn active" onclick="switchMainTab('sec1')">Can you guess AI?</button>
            <button class="nav-frame-btn" onclick="switchMainTab('sec2')">Human art or AI?</button>
        </div>

        <!-- SECTION 1: Can you guess AI? -->
        <section id="sec1" class="main-section active">
            <h1 class="section-title">Can you guess AI?</h1>
            <p class="subtitle">You can choose multiple images but only one is original.</p>
            <p class="zoom-hint">You can zoom in to look closely!</p>

            <!-- Level Switcher -->
            <div class="level-switcher">
                <button id="lvl-tab-1" class="level-tab active" onclick="switchLevel(1)">Level 1</button>
                <button id="lvl-tab-2" class="level-tab" onclick="switchLevel(2)">Level 2</button>
            </div>

            <!-- Level 1 Content -->
            <div id="level-1" class="level-content active">
                <h2 id="l1-title" class="level-title-display">The Ark</h2>
                <div id="l1-grid" class="grid-3"></div>
                <button id="l1-submit" class="action-btn" onclick="checkQuiz(1)">Send</button>
                <div id="l1-feedback" class="feedback-area"></div>
            </div>

            <!-- Level 2 Content -->
            <div id="level-2" class="level-content">
                <h2 id="l2-title" class="level-title-display">Grablegung Christi</h2>
                <div id="l2-grid" class="grid-3"></div>
                <button id="l2-submit" class="action-btn" onclick="checkQuiz(2)">Send</button>
                <div id="l2-feedback" class="feedback-area"></div>
            </div>
        </section>

        <!-- SECTION 2: Human art or AI? -->
        <section id="sec2" class="main-section">
            <h1 class="section-title">Human art or AI?</h1>
            <p class="subtitle">Are these arts AI or made by a human?</p>
            <p class="zoom-hint">You can zoom in to look closely!</p>

            <!-- 6 Drawings Grid -->
            <div id="sec2-grid" class="grid-6"></div>

            <!-- Choice Buttons -->
            <div class="choice-boxes">
                <button class="choice-btn" onclick="selectSec2Choice(this, 'ai')">AI</button>
                <button class="choice-btn" onclick="selectSec2Choice(this, 'human')">Human made</button>
            </div>

            <button id="sec2-submit" class="action-btn" onclick="submitSec2Choice()">Send</button>

            <!-- Feedback Area -->
            <div id="sec2-feedback" class="feedback-area"></div>
        </section>

        <!-- Footer -->
        <footer>
            <p>Made by: n.w.nc</p>
        </footer>

    </div>

    <!-- Zoom Lightbox Modal -->
    <div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
        <div class="zoom-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeZoom()">✕</button>
            <img id="modalImg" src="" alt="Zoomed view">
        </div>
    </div>

    <script>
        /* Level Data with Image Fallback Placeholders */
        const levelData = {
            1: {
                name: "The Ark",
                cards: [
                    { id: '1a', src: 'original.jpg', fallbackText: 'The Ark (Original)', isAI: false, label: 'Original' },
                    { id: '1b', src: 'exp1-a.png', fallbackText: 'The Ark (AI Variant 1)', isAI: true, label: 'AI Generated' },
                    { id: '1c', src: 'exp1-b.png', fallbackText: 'The Ark (AI Variant 2)', isAI: true, label: 'AI Generated' }
                ]
            },
            2: {
                name: "Grablegung Christi",
                cards: [
                    { id: '2a', src: 'original2.jpg', fallbackText: 'Grablegung Christi (Original)', isAI: false, label: 'Original' },
                    { id: '2b', src: 'exp3-a.png', fallbackText: 'Grablegung Christi (AI Variant 1)', isAI: true, label: 'AI Generated' },
                    { id: '2c', src: 'exp3-b.png', fallbackText: 'Grablegung Christi (AI Variant 2)', isAI: true, label: 'AI Generated' }
                ]
            }
        };

        /* Section 2 Drawings Data */
        const sec2Images = [
            { src: '20250206_171337.jpg', text: 'Koenigsegg Drawing' },
            { src: '20260322_210612.jpg', text: 'Red Supercar Drawing' },
            { src: 'IMG_20260223_060231_696.jpg', text: 'Porsche 911 GT3 RS Sketch' },
            { src: '20251122_221803.jpg', text: 'Train Pencil Drawing' },
            { src: '20260910_164954.jpg', text: 'F1 Drivers Portrait' },
            { src: '20250731_214138.jpg', text: 'Lando Norris Drawing' }
        ];

        /* Shuffle Utility */
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /* SVG Placeholder Generator */
        function createSvgFallback(text) {
            return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%231a1a1a"/><text x="50%" y="50%" fill="%23D4AF37" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">${encodeURIComponent(text)}</text></svg>`;
        }

        /* State Variables */
        const selections = { 1: new Set(), 2: new Set() };
        let sec2SelectedChoice = null;

        /* DOM Content Initialization */
        document.addEventListener("DOMContentLoaded", () => {
            initSection1();
            initSection2();
            setupParticleCanvas();
        });

        /* Render Section 1 Quiz */
        function initSection1() {
            [1, 2].forEach(lvl => {
                const grid = document.getElementById(`l${lvl}-grid`);
                grid.innerHTML = '';
                const shuffledCards = shuffleArray(levelData[lvl].cards);

                shuffledCards.forEach(card => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'artwork-card';
                    cardEl.id = `card-${card.id}`;

                    const badge = document.createElement('div');
                    badge.className = `badge ${card.isAI ? 'ai' : 'original'}`;
                    badge.innerText = card.label;
                    badge.id = `badge-${card.id}`;

                    const imgWrap = document.createElement('div');
                    imgWrap.className = 'img-container';
                    imgWrap.onclick = () => openZoom(card.src, card.fallbackText);

                    const img = document.createElement('img');
                    img.src = card.src;
                    img.alt = card.fallbackText;
                    img.onerror = function() {
                        this.src = createSvgFallback(card.fallbackText);
                    };

                    imgWrap.appendChild(img);

                    const btn = document.createElement('button');
                    btn.className = 'ai-select-btn';
                    btn.innerText = 'AI';
                    btn.id = `btn-${card.id}`;
                    btn.onclick = () => toggleAISelection(lvl, card.id);

                    cardEl.appendChild(badge);
                    cardEl.appendChild(imgWrap);
                    cardEl.appendChild(btn);

                    grid.appendChild(cardEl);
                });
            });
        }

        /* Toggle AI Button Selection */
        function toggleAISelection(lvl, cardId) {
            const cardEl = document.getElementById(`card-${cardId}`);
            const btnEl = document.getElementById(`btn-${cardId}`);

            if (selections[lvl].has(cardId)) {
                selections[lvl].delete(cardId);
                cardEl.classList.remove('selected');
                btnEl.classList.remove('selected');
            } else {
                selections[lvl].add(cardId);
                cardEl.classList.add('selected');
                btnEl.classList.add('selected');
            }
        }

        /* Check Level Quiz Answers */
        function checkQuiz(lvl) {
            const cards = levelData[lvl].cards;
            const chosen = selections[lvl];
            const feedbackEl = document.getElementById(`l${lvl}-feedback`);
            const submitBtn = document.getElementById(`l${lvl}-submit`);

            // Reveal Badges
            cards.forEach(c => {
                const badge = document.getElementById(`badge-${c.id}`);
                if (badge) badge.style.display = 'block';
            });

            // Find if user picked the Original image
            const originalCard = cards.find(c => !c.isAI);
            const pickedOriginal = chosen.has(originalCard.id);

            // Find if user correctly picked all AI images and only AI images
            const aiCardIds = cards.filter(c => c.isAI).map(c => c.id);
            const pickedAllAI = aiCardIds.every(id => chosen.has(id));
            const pickedOnlyAI = chosen.size === aiCardIds.length && pickedAllAI;

            if (pickedOnlyAI) {
                feedbackEl.innerHTML = `<div class="feedback-text success">Congratulations, you got it right!</div>`;
                triggerParticles(submitBtn);
            } else if (pickedOriginal) {
                feedbackEl.innerHTML = `<div class="feedback-text error">Almost! But you choose the Original. Maybe Next time!</div>`;
            } else {
                feedbackEl.innerHTML = `<div class="feedback-text error">Better luck next time!</div>`;
            }

            submitBtn.disabled = true;
        }

        /* Render Section 2 Drawings */
        function initSection2() {
            const grid = document.getElementById('sec2-grid');
            grid.innerHTML = '';
            const shuffledDrawings = shuffleArray(sec2Images);

            shuffledDrawings.forEach(item => {
                const cardEl = document.createElement('div');
                cardEl.className = 'artwork-card';

                const imgWrap = document.createElement('div');
                imgWrap.className = 'img-container';
                imgWrap.onclick = () => openZoom(item.src, item.text);

                const img = document.createElement('img');
                img.src = item.src;
                img.alt = item.text;
                img.onerror = function() {
                    this.src = createSvgFallback(item.text);
                };

                imgWrap.appendChild(img);
                cardEl.appendChild(imgWrap);
                grid.appendChild(cardEl);
            });
        }

        /* Section 2 Choice Selection */
        function selectSec2Choice(btnEl, choice) {
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
            btnEl.classList.add('selected');
            sec2SelectedChoice = choice;
        }

        /* Submit Section 2 Guess */
        function submitSec2Choice() {
            const feedbackEl = document.getElementById('sec2-feedback');
            const submitBtn = document.getElementById('sec2-submit');

            if (!sec2SelectedChoice) {
                feedbackEl.innerHTML = `<div class="feedback-text error">Please select one option above!</div>`;
                return;
            }

            if (sec2SelectedChoice === 'human') {
                feedbackEl.innerHTML = `
                    <div class="feedback-text success">
                        You are right! These images were made by a human!
                        <div class="artist-description">
                            Surprise! These arts were made by me!<br>
                            You can see more of my creations on IG account <a href="https://instagram.com/n.w.nc.art" target="_blank" rel="noopener">@n.w.nc.art</a>
                        </div>
                    </div>
                `;
                triggerParticles(submitBtn);
            } else {
                feedbackEl.innerHTML = `
                    <div class="feedback-text error">
                        You are wrong! These arts were made by a human and not Artificial Intelligence.
                        <div class="artist-description">
                            These arts were made by me! You can see more of my creations on IG account <a href="https://instagram.com/n.w.nc.art" target="_blank" rel="noopener">@n.w.nc.art</a>
                        </div>
                    </div>
                `;
            }

            submitBtn.disabled = true;
        }

        /* Top Tab Switching */
        function switchMainTab(secId) {
            document.querySelectorAll('.nav-frame-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.main-section').forEach(sec => sec.classList.remove('active'));

            if (secId === 'sec1') {
                document.querySelectorAll('.nav-frame-btn')[0].classList.add('active');
            } else {
                document.querySelectorAll('.nav-frame-btn')[1].classList.add('active');
            }

            document.getElementById(secId).classList.add('active');
        }

        /* Level Switching (Section 1) */
        function switchLevel(lvl) {
            document.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.level-content').forEach(c => c.classList.remove('active'));

            document.getElementById(`lvl-tab-${lvl}`).classList.add('active');
            document.getElementById(`level-${lvl}`).classList.add('active');
        }

        /* Zoom Lightbox Modal Logic */
        function openZoom(src, fallbackText) {
            const modal = document.getElementById('zoomModal');
            const modalImg = document.getElementById('modalImg');

            modalImg.src = src;
            modalImg.onerror = function() {
                this.src = createSvgFallback(fallbackText);
            };

            modal.classList.add('active');
        }

        function closeZoom() {
            document.getElementById('zoomModal').classList.remove('active');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeZoom();
        });

        let canvas, ctx, particles = [], particleAnimId = null;

        function setupParticleCanvas() {
            canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function triggerParticles(sourceEl) {
            setupParticleCanvas();
            
            let originX = window.innerWidth / 2;
            let originY = window.innerHeight / 3;

            if (sourceEl && sourceEl.getBoundingClientRect) {
                const rect = sourceEl.getBoundingClientRect();
                originX = rect.left + rect.width / 2;
                originY = rect.top + rect.height / 2;
            }

            const goldColors = ['#D4AF37', '#FFD700', '#FFF8DC', '#F0E68C', '#FFFFFF', '#E6CA65'];
            
            const createBurst = (count, startYOffset = 0) => {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 12 + 4;
                    particles.push({
                        x: originX + (Math.random() - 0.5) * 30,
                        y: originY + startYOffset + (Math.random() - 0.5) * 20,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 5,
                        size: Math.random() * 8 + 3,
                        color: goldColors[Math.floor(Math.random() * goldColors.length)],
                        alpha: 1,
                        decay: Math.random() * 0.012 + 0.008,
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.2,
                        shape: Math.random() > 0.4 ? 'circle' : (Math.random() > 0.5 ? 'rect' : 'star')
                    });
                }
            };

            // Double wave particle burst for a rich celebration
            createBurst(90);
            setTimeout(() => {
                createBurst(70, -15);
            }, 140);

            if (!particleAnimId) {
                particleAnimId = requestAnimationFrame(updateParticles);
            }
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function updateParticles() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let activeCount = 0;
            particles.forEach(p => {
                if (p.alpha > 0) {
                    activeCount++;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.98; // Air friction
                    p.vy += 0.22; // Gravity
                    p.alpha -= p.decay;
                    p.rotation += p.vRot;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);

                    if (p.shape === 'circle') {
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (p.shape === 'rect') {
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
                    } else {
                        drawStar(ctx, 0, 0, 4, p.size, p.size / 2, p.color);
                    }

                    ctx.restore();
                }
            });

            if (activeCount > 0) {
                particleAnimId = requestAnimationFrame(updateParticles);
            } else {
                particleAnimId = null;
                particles = [];
            }
        }
    </script>
</body>
